name: Daily NBA Data Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt

    # `camoufox fetch` hits api.github.com unauthenticated (no token support) and
    # gets 403 rate-limited on shared runner IPs. Cache the browser so it only
    # downloads when the pinned version changes.
    - name: Restore Camoufox browser cache
      id: camoufox-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/camoufox
        key: camoufox-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

    # camoufox calls the API via `requests`, which reads ~/.netrc, so this
    # authenticates it with the job token (1000 req/hr instead of shared 60/hr).
    - name: Install Scrapling browsers
      if: steps.camoufox-cache.outputs.cache-hit != 'true'
      env:
        GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf 'machine api.github.com login x-access-token password %s\n' "$GH_API_TOKEN" > ~/.netrc
        chmod 600 ~/.netrc
        scrapling install
        rm ~/.netrc

    # Save right away so a later scraper failure doesn't skip saving.
    - name: Save Camoufox browser cache
      if: steps.camoufox-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/camoufox
        key: ${{ steps.camoufox-cache.outputs.cache-primary-key }}

    - name: Install Playwright browsers
      run: |
        playwright install --with-deps chromium
        # system libs camoufox (Firefox) needs; normally done by `scrapling install`
        playwright install-deps firefox

    - name: Run usage rate scraper
      run: |
        cd backend
        python nba_usage_rate_scraper.py

    - name: Run defense scraper
      continue-on-error: true
      run: |
        cd backend
        python nba_defense_scraper.py

    - name: Run NBA data scraper
      run: |
        cd backend
        python nba_data_scraper.py

    - name: Run FantasyPros last-15 scraper
      continue-on-error: true
      run: |
        cd backend
        python last15_scraper.py

    - name: Commit and push if changed
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add backend/data

        # Check if there are changes
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "Update scraped data [automated]"

          # Push to GitHub
          git push

          # Trigger Render redeploy
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        else
          echo "No changes to commit"
        fi
